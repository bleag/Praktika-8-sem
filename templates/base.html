<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Platform{% endblock %}</title>
    <!-- ОБЩИЕ СТИЛИ (всегда подключены) -->
    <link rel="stylesheet" href="/static/css/common/base.css">
    <link rel="stylesheet" href="/static/css/common/layout.css">
    <link rel="stylesheet" href="/static/css/common/forms.css">
    <link rel="stylesheet" href="/static/css/common/components.css">
    <!-- СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ СТРАНИЦЫ -->
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    <header class="header-new">
        <div class="container header-new__inner">
            <div class="logo">
                <a href="/" class="logo__link">Главная страница</a>
            </div>
            <nav class="nav">
                <a href="/play" class="nav__link">Играть</a>
                <a href="/prices" class="nav__link">Цены</a>
                {% if user %}
                     <a href="/profile" class="nav__link">Мои викторины</a>
                 {% endif %}
            </nav>
            <div class="header-actions">
                {% if user %}
                    <span class="user-greeting-new">Привет, {{ user.nickname }}!</span>
                    <a href="/logout" class="btn-outline-new">Выйти</a>
                {% else %}
                    <a href="/register" class="btn-primary">Попробовать сейчас</a>
                    <a href="/login" class="btn-outline-new">Войти</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="{% block main_class %}main{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer__copyright">
                © 2026 Quiz Platform
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
