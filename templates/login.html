{% extends "base.html" %}

{% block title %}Вход - Quiz Platform{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block main_class %}auth-main{% endblock %}

{% block content %}
<style>
    .form-input {
        width: 100% !important;
        padding: 14px 16px !important;
        border: 2px solid #e2e8f0 !important;
        border-radius: 12px !important;
        font-size: 16px !important;
        transition: all 0.3s ease !important;
    }

    .form-input:focus {
        border-color: #2563eb !important;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15) !important;
        outline: none !important;
    }

    .btn-block {
        width: 100% !important;
        padding: 14px !important;
        font-size: 17px !important;
        font-weight: 600 !important;
        border-radius: 12px !important;
        border: none !important;
        cursor: pointer;
        transition: all 0.3s ease !important;
    }

    .btn-blue {
        background: linear-gradient(90deg, #2563eb, #1e40af) !important;
        color: white !important;
    }

    .btn-blue:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35) !important;
    }

    .error-message {
        background: #fee2e2 !important;
        color: #ef4444 !important;
        padding: 12px 16px !important;
        border-radius: 10px !important;
        border-left: 4px solid #ef4444 !important;
        margin: 15px 0 !important;
        font-size: 15px !important;
    }

    .auth-footer {
        text-align: center;
        margin-top: 24px;
        color: #64748b;
    }

    .auth-footer a {
        color: #2563eb !important;
        font-weight: 600;
    }

    .auth-back {
        text-align: center;
        margin-top: 28px;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Вход</h1>
        
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="nickname">Никнейм</label>
                <input type="text" id="nickname" name="nickname" class="form-input" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" required>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <button type="submit" class="btn btn-blue btn-block">Войти</button>
        </form>
        
        <p class="auth-footer">
            Нет аккаунта? <a href="/register">Зарегистрируйтесь</a>
        </p>
        
        <div class="auth-back">
            <a href="/" class="btn-link">← На главную</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nickname = document.getElementById('nickname').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        
        errorDiv.style.display = 'none';
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nickname, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                window.location.href = '/profile';
            } else {
                errorDiv.textContent = data.error;
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'Ошибка сервера. Попробуйте позже.';
            errorDiv.style.display = 'block';
        }
    });
</script>

{% endblock %}
